[project]
name = "beril-cli"
version = "0.0.6"
description = "BERIL Research Observatory — CLI launcher and environment manager"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "boto3",
  "certifi",
  "httpx",
  # OpenViking server + SDK are released in step but only loosely coupled in
  # metadata (the server declares a floor on the SDK; the SDK declares nothing).
  # The server rejects request fields it does not know (extra="forbid"), and the
  # SDK forwards every field it declares — so an SDK newer than the server
  # breaks, while a newer server tolerates an older SDK. Keep these two pins at
  # a matching pair, upgrade the server first, and keep the SDK pin identical
  # to ui/pyproject.toml so both projects resolve the same version.
  "openviking==0.4.22",
  "openviking_sdk==0.1.12",
  "pyyaml",
  "rich",
]

[dependency-groups]
dev = [
    "mistune>=3",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
beril = "beril_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
