[project]
name = "beril-cli"
version = "0.0.6"
description = "BERIL Research Observatory — CLI launcher and environment manager"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "boto3",
  "certifi",
  "httpx",
  "openviking",
  "pyyaml",
  "rich",
]

[dependency-groups]
dev = [
    "mistune>=3",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
beril = "beril_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
