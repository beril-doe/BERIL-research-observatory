[project]
name = "beril-cli"
version = "0.0.6"
description = "BERIL Research Observatory — CLI launcher and environment manager"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx", "certifi"]

[project.scripts]
beril = "beril_cli.cli:main"

[dependency-groups]
# mistune is OPTIONAL AT RUNTIME — tools/dashboard.py imports it in a try/except
# and degrades to escaped <pre>, and the project's runtime `dependencies` stays
# empty by design. Pinned here because tier 1 is what actually runs in the pod,
# and its `escape=True` is a security property: without the library installed
# that assertion silently falls through to the <pre> tier and proves nothing.
test = ["pytest>=8", "mistune>=3"]
knowledge = [
  "openviking",
  "pyyaml",
  "pytest",
  "rich",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
