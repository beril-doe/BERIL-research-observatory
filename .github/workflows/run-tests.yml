name: Install and test
on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review

jobs:
  install_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          cd ui
          uv sync --all-extras

      - name: Run tests
        run: |
          cd ui
          uv run pytest

      # The root suite covers beril_cli/ and tools/ and had never run on a PR:
      # the step above cds into ui/, whose testpaths is scoped to ui/tests.
      # Explicit `tests/` because the root project sets no testpaths, and a bare
      # `uv run pytest` from here also tries to collect ui/tests, which fails on
      # `No module named 'tests.conftest'` — the two suites both use a top-level
      # `tests` package name.
      - name: Install root dependencies
        run: uv sync --group test

      - name: Run root tests
        run: uv run pytest tests/

      - name: Send to Codecov
        uses: codecov/codecov-action@v5
        with:
            token: ${{ secrets.CODECOV_TOKEN }}
