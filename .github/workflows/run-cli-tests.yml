name: Install and test BERIL CLI
on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review

jobs:
  install_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: |
          uv sync

      - name: Run CLI tests
        run: |
          uv run pytest tests/ --cov=beril_cli --cov=tools --cov=knowledge --cov=observatory_context --cov-report=xml

      - name: Send to Codecov
        uses: codecov/codecov-action@v7
        with:
            token: ${{ secrets.CODECOV_TOKEN }}
            files: ./coverage.xml
            # Without this codecov filename-searches the repo and uploads any
            # projects/**/ *coverage*.tsv it finds instead of a real report.
            disable_search: true
