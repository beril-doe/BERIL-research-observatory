name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      - 'projects/**'
      - 'docs/**'
      - 'wiki/**'
      - 'Dockerfile'
      - '.github/workflows/build-image.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ui/**'
      - 'projects/**'
      - 'docs/**'
      - 'wiki/**'
      - 'Dockerfile'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Pinned explicitly rather than derived from github.repository_owner so that
  # transferring the repo between orgs does not silently change the published
  # image path out from under the SPIN deployment manifests.
  IMAGE_NAME: beril-doe/microbial-data-forge
  GIT_COMMIT_HASH: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current datestamp
        run: echo "BUILD_DATE=$(date -u)" >> $GITHUB_ENV

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
