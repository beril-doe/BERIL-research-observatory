[project]
name = "beril-observatory-ui"
version = "0.1.0"
description = "BERIL Research Observatory Web Interface"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "authlib>=1.6.9",
    "claude-agent-sdk>=0.1.65",
    "cryptography>=43",
    "fastapi>=0.115.0",
    "gitpython==3.1.41",
    "httpx>=0.27",
    "itsdangerous>=2.2.0",
    "jinja2==3.1.6",
    "kbase-auth-client==0.1.2",
    "markdown==3.7",
    "mcp>=1.0",
    "nbconvert==7.17.0",
    "nbformat==5.9.2",
    "openviking==0.4.15",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.5.2",
    "pymdown-extensions==10.11",
    "python-dotenv==1.0.0",
    "pyyaml==6.0.1",
    "pygments>=2.19.2",
    "python-multipart>=0.0.24",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.27.0",
    "whoosh==2.7.4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.26.0",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-report=html:htmlcov"

[tool.coverage.run]
source = ["app"]
omit = ["app/templates/*", "app/static/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
