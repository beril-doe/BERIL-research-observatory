services:
  proxy:
    image: nginx:alpine
    # Owns host port 8000 and path-routes: /ov -> openviking, /wiki -> wiki,
    # everything else -> ui. Mirrors the SPIN NGINX ingress so
    # http://localhost:8000/ov works locally the same way it does on SPIN.
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - ui
      - openviking

  ui:
    build: .
    # Host port 8000 is owned by the proxy service, which fronts both the UI
    # and OpenViking (/ov). The UI is reachable to the proxy over the compose
    # network as http://ui:8000.
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      # Reach OpenViking over the compose network, not the .env localhost default.
      BERIL_OV_URL: http://openviking:1933
      # The wiki as the context API's second backend (source=wiki); the token
      # must equal WIKI_INTERNAL_TOKEN on the wiki service. Links point at the
      # proxy's /wiki.
      BERIL_WIKI_INTERNAL_URL: http://wiki:8080
      BERIL_WIKI_INTERNAL_TOKEN: ${BERIL_WIKI_INTERNAL_TOKEN:-dev-wiki-internal-token}
      BERIL_WIKI_PUBLIC_URL: http://localhost:8000/wiki
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      openviking:
        condition: service_started
    develop:
      watch:
        - action: sync+restart
          path: ./ui/app
          target: /repo/ui/app
          initial_sync: true
        - action: sync+restart
          path: ./ui/config
          target: /repo/ui/config
        - action: rebuild
          path: ./ui/pyproject.toml
        - action: rebuild
          path: ./ui/uv.lock
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./.env


  # The BERIL wiki, a static site from beril-doe/beril-wiki, served at /wiki as
  # on SPIN. Opt-in: `docker compose --profile wiki up -d`. The published
  # :develop image is built for beril-dev.kbase.us/wiki, so only its absolute
  # links (footer About, sitemap) point there; to use a local build set
  # BERIL_WIKI_IMAGE (see the beril-wiki README, "The SPIN image").
  wiki:
    # The BERIL wiki, served at /wiki by the proxy. Built from the sibling
    # beril-wiki checkout (BERIL_WIKI_SRC, default ../beril-wiki), site and all,
    # so `docker compose --profile wiki up --build` needs no separate render
    # step; the first build clones Quartz and takes a few minutes. To run a
    # pulled image instead, set BERIL_WIKI_IMAGE and leave --build off.
    build:
      context: ${BERIL_WIKI_SRC:-../beril-wiki}
      args:
        SITE_FROM: site
        WIKI_BASE_URL: ${BERIL_WIKI_BASE_URL:-localhost:8000/wiki}
    image: ${BERIL_WIKI_IMAGE:-beril-wiki:local}
    profiles: ["wiki"]
    expose:
      - "8080"
    environment:
      # The token the webapp's WikiManager presents on /wiki/_api; must equal
      # BERIL_WIKI_INTERNAL_TOKEN on the ui service.
      WIKI_INTERNAL_TOKEN: ${BERIL_WIKI_INTERNAL_TOKEN:-dev-wiki-internal-token}
      # POST /wiki/_admin/reload bearer token.
      WIKI_RELOAD_TOKEN: ${WIKI_RELOAD_TOKEN:-dev-wiki-reload-token}
      # A file:// artifact store shared with the host (BERIL_WIKI_STORE), so
      # `python -m beril_wiki.publish.artifact push` from the wiki checkout
      # lands where this container reloads from.
      WIKI_ARTIFACT_ENDPOINT: file:///srv/artifact-store
      WIKI_ARTIFACT_BUCKET: wiki
    volumes:
      - wikiartifacts:/srv/artifacts
      - ${BERIL_WIKI_STORE:-./.wiki-store}:/srv/artifact-store
    restart: unless-stopped

  openviking:
    build:
      context: ./knowledge/openviking
    # Override the SPIN-oriented default if you want a different in-container
    # config location: pass OV_CONFIG_PATH as a build arg here.
    ports:
      - "1933:1933"   # OpenViking API (consumed by the ui service)
      - "8020:8020"   # OpenViking secondary port
    env_file:
      - .env
    environment:
      VERTEXAI_LOCATION: us-central1
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/gcp-key.json
      OV_SERVER_KEY: ${OV_SERVER_KEY}
    volumes:
      # Provide the OpenViking config locally. Copy/author it before `up`.
      - ./knowledge/openviking/ov.conf:/var/openviking/ov.conf:ro
      - ./knowledge/openviking/gcp-key.json:/var/secrets/gcp-key.json:ro
      # Persist ingested content / embeddings across restarts.
      - ovworkspace:/ov/workspace
    restart: unless-stopped

  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: beril_user       # Must match BERIL_DB_USER in .env
      POSTGRES_PASSWORD: changeme     # Must match BERIL_DB_PASSWORD in .env
      POSTGRES_DB: beril              # Must match BERIL_DB_NAME in .env
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beril_user -d beril"]
      interval: 2s
      timeout: 3s
      retries: 15
    # Uncomment for local development to allow psql/GUI access from the host.
    # Do not expose in production.
    # ports:
    #   - "5432:5432"

volumes:
  pgdata:
  ovworkspace:
  wikiartifacts:
