  - NB01_cwm_construction: "ke_pangenome join, CWM computation, matrix QC"
  - NB02_usa_metal_associations: "L0–L6 FWL vs USGS metals, FDR hits, attrition figure"
  - NB03_functional_interpretation: "Hit characterization, pathway context, figures"
  - NB04_regional_replication: "EUR GEMAS, AUS NGSA, mine proximity"
