# Local reverse proxy that mirrors the SPIN/NGINX Ingress: serve the BERIL UI
# at / and route the /ov path to the OpenViking container, stripping the /ov
# prefix before forwarding (the OV server expects bare paths like /health).
# /wiki goes to the beril-wiki container unchanged (it serves under /wiki).
# Service names (ui, openviking, wiki) resolve over the docker-compose network.

upstream beril_ui {
    server ui:8000;
}

upstream beril_openviking {
    server openviking:1933;
}

server {
    listen 8000;
    server_name localhost;

    # OpenViking, reachable at http://localhost:8000/ov/...
    # `/ov` (no trailing slash) and `/ov/...` both rewrite to the OV server
    # with the /ov prefix removed, matching the SPIN ingress rewrite-target.
    location ~ ^/ov(/.*)?$ {
        # $1 is the captured remainder (may be empty -> "/").
        rewrite ^/ov(/.*)?$ $1 break;
        proxy_pass http://beril_openviking;

        # $http_host is the verbatim incoming Host header, INCLUDING the port
        # (localhost:8000). $host drops the port, which makes the app generate
        # absolute URLs like http://localhost/static/... (port 80) and breaks
        # CSS/asset loading behind the proxy.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The BERIL wiki (beril-doe/beril-wiki), reachable at http://localhost:8000/wiki/.
    # No rewrite: the wiki is built for, and serves under, /wiki. Matched by
    # whole path segment, as the ingress Prefix rule is (/wikis stays with the
    # UI). The wiki service is opt-in (`docker compose --profile wiki up -d`), so its name is
    # resolved per request through Docker's DNS rather than at startup, where a
    # missing service would stop nginx from starting at all; without it /wiki
    # is a 502 and everything else is unaffected.
    location ~ ^/wiki(/|$) {
        resolver 127.0.0.11 valid=10s;
        set $beril_wiki http://wiki:8080;
        proxy_pass $beril_wiki;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Context ingest: a zipped project. Sized to the app's own archive cap
    # (BERIL_CONTEXT_MAX_ARCHIVE_BYTES, 32 MiB) plus multipart overhead — the
    # app checks the real bound; this only stops nginx's 1 MB default from
    # refusing a real project first. The SPIN ingress needs the same limit
    # (nginx.ingress.kubernetes.io/proxy-body-size: 40m on this path).
    location = /api/context/ingest_files {
        client_max_body_size 40m;
        proxy_pass http://beril_ui;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> the BERIL UI app.
    location / {
        proxy_pass http://beril_ui;

        # $http_host is the verbatim incoming Host header, INCLUDING the port
        # (localhost:8000). $host drops the port, which makes the app generate
        # absolute URLs like http://localhost/static/... (port 80) and breaks
        # CSS/asset loading behind the proxy.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
